services:
  backend:
    image: mds01-video-detection:local
    build:
      context: .
      dockerfile: backend/Dockerfile.video-detection
    environment:
      VIDEO_DETECTION_ENABLED: "true"
      VSVIG_ASSET_DIR: /opt/vsvig
    volumes:
      - type: bind
        source: ${VSVIG_ASSET_DIR:?Set an absolute external model bundle directory}
        target: /opt/vsvig
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VIDEO_DATA_DIR:?Set an absolute approved video directory}
        target: /private-video-data
        read_only: true
        bind:
          create_host_path: false
