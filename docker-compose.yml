services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: seizureai
      POSTGRES_USER: seizureai
      POSTGRES_PASSWORD: seizureai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seizureai -d seizureai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://seizureai:seizureai@postgres:5432/seizureai
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      MODEL_RUNTIME: stub
      STORAGE_DIR: /app/backend/storage
      MDS01_STORAGE_KEY: ${MDS01_STORAGE_KEY:-}
      MDS01_TEMPLATE_KEY: ${MDS01_TEMPLATE_KEY:-}
      ENABLE_SIGNAL_PREVIEW: ${ENABLE_SIGNAL_PREVIEW:-false}
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/backend/storage
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -c "alembic -c backend/alembic.ini upgrade head &&
      uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
  backend_storage:
