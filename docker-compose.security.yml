services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mds01_security
      POSTGRES_USER: mds01_security
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Provide a disposable test password}
    volumes:
      - security_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mds01_security -d mds01_security"]
      interval: 2s
      timeout: 3s
      retries: 20
    mem_limit: ${SECURITY_POSTGRES_MEMORY_LIMIT:-2g}
    cpus: ${SECURITY_POSTGRES_CPU_LIMIT:-2.0}
    pids_limit: ${SECURITY_POSTGRES_PIDS_LIMIT:-512}
    ulimits:
      nofile:
        soft: 4096
        hard: 4096

  storage-init:
    image: alpine:3.22
    user: "0:0"
    mem_limit: ${SECURITY_STORAGE_INIT_MEMORY_LIMIT:-256m}
    cpus: ${SECURITY_STORAGE_INIT_CPU_LIMIT:-0.5}
    pids_limit: ${SECURITY_STORAGE_INIT_PIDS_LIMIT:-128}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    command: sh -c "chown -R 999:999 /app/backend/storage && chmod 700 /app/backend/storage"
    volumes:
      - security_storage:/app/backend/storage

  backend:
    image: mds01-security-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://mds01_security:${POSTGRES_PASSWORD:?Provide a disposable test password}@postgres:5432/mds01_security
      STORAGE_DIR: /app/backend/storage
      CORS_ORIGINS: http://127.0.0.1:3002
      APP_ENV: test
      AUTH_MODE: local-accounts
      MODEL_RUNTIME: stub
      MDS01_STORAGE_KEY: ${MDS01_STORAGE_KEY:?Provide a disposable test storage key}
      MDS01_TEMPLATE_KEY: ${MDS01_TEMPLATE_KEY:?Provide a disposable test template key}
      VIDEO_DETECTION_ENABLED: "true"
      VSVIG_ALLOW_LETTERBOX_ADAPTATION: "false"
      ENABLE_SIGNAL_PREVIEW: "false"
      MAX_CONCURRENT_ANALYSES: "1"
      MDS01_MAX_ARCHIVE_TOTAL_BYTES: "10485760"
      MDS01_MAX_ZIP_COMPRESSION_RATIO: "100"
      MDS01_MAX_NICOLET_SIGNAL_VALUES: "20000000"
      MDS01_MAX_LEGACY_NICOLET_EVENTS: ${MDS01_MAX_LEGACY_NICOLET_EVENTS:-100000}
    ports:
      - "127.0.0.1:${SECURITY_BACKEND_PORT:-18000}:8000"
    platform: linux/amd64
    user: "999:999"
    mem_limit: ${SECURITY_BACKEND_MEMORY_LIMIT:-2g}
    cpus: ${SECURITY_BACKEND_CPU_LIMIT:-2.0}
    pids_limit: ${SECURITY_BACKEND_PIDS_LIMIT:-256}
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    volumes:
      - security_storage:/app/backend/storage
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    command: >-
      sh -c "alembic -c backend/alembic.ini upgrade head &&
      uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --no-server-header"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  security_postgres:
  security_storage:
