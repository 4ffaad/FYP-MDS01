services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mds01_security
      POSTGRES_USER: mds01_security
      POSTGRES_PASSWORD: disposable-security-test
    volumes:
      - security_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mds01_security -d mds01_security"]
      interval: 2s
      timeout: 3s
      retries: 20

  storage-init:
    image: alpine:3.22
    user: "0:0"
    command: sh -c "chown -R 999:999 /app/backend/storage && chmod 700 /app/backend/storage"
    volumes:
      - security_storage:/app/backend/storage

  backend:
    image: mds01-security-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://mds01_security:disposable-security-test@postgres:5432/mds01_security
      STORAGE_DIR: /app/backend/storage
      CORS_ORIGINS: http://127.0.0.1:3002
      APP_ENV: test
      AUTH_MODE: local-accounts
      MODEL_RUNTIME: stub
      MDS01_STORAGE_KEY: c3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3M=
      MDS01_TEMPLATE_KEY: dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      ENABLE_SIGNAL_PREVIEW: "false"
      MAX_CONCURRENT_ANALYSES: "1"
      MDS01_MAX_ARCHIVE_TOTAL_BYTES: "10485760"
      MDS01_MAX_ZIP_COMPRESSION_RATIO: "100"
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - security_storage:/app/backend/storage
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    command: >-
      sh -c "alembic -c backend/alembic.ini upgrade head &&
      uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --no-server-header"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  security_postgres:
  security_storage:
