<text x="49" y="47" text-anchor="start" fill="#10243A" font-family="Arial, sans-serif" font-size="25" font-weight="700">EEG  |  Source retention, clinical display, and H5 findings</text>
<rect x="40.0" y="240.0" width="205.0" height="110.0" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
<text x="142.5" y="279.48" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="14" >1  EEG archive upload</text>
<text x="142.5" y="297.48" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="14" >Supported recording formats</text>
<text x="142.5" y="315.48" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="14" >Owner-scoped case</text>
<rect x="300.0" y="240.0" width="220.0" height="110.0" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" filter="url(#shadow)"/>
<text x="410" y="279.48" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="14" >2  Encrypt before persistence</text>
<text x="410" y="297.48" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="14" >AES-GCM source archive</text>
<text x="410" y="315.48" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="14" >Private storage outside PostgreSQL</text>
<rect x="575.0" y="240.0" width="220.0" height="110.0" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
<text x="685" y="279.48" text-anchor="middle" fill="#78350F" font-family="Arial, sans-serif" font-size="14" >3  Background processing</text>
<text x="685" y="297.48" text-anchor="middle" fill="#78350F" font-family="Arial, sans-serif" font-size="14" >Owner-only temporary workspace</text>
<text x="685" y="315.48" text-anchor="middle" fill="#78350F" font-family="Arial, sans-serif" font-size="14" >Plaintext removed after use</text>
<rect x="850.0" y="240.0" width="220.0" height="110.0" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="2" filter="url(#shadow)"/>
<text x="960" y="279.48" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="14" >4  Validate + parse source</text>
<text x="960" y="297.48" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="14" >Retain channels, timing, gaps</text>
<text x="960" y="315.48" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="14" >Read source annotations</text>
<rect x="1120.0" y="240.0" width="190.0" height="110.0" rx="3" fill="#FEFCE8" stroke="#CA8A04" stroke-width="2" filter="url(#shadow)"/>
<text x="1215" y="279.48" text-anchor="middle" fill="#713F12" font-family="Arial, sans-serif" font-size="14" >Separate paths</text>
<text x="1215" y="297.48" text-anchor="middle" fill="#713F12" font-family="Arial, sans-serif" font-size="14" >Original waveform for review</text>
<text x="1215" y="315.48" text-anchor="middle" fill="#713F12" font-family="Arial, sans-serif" font-size="14" >Model tensor for inference</text>
<rect x="1370.0" y="125.0" width="240.0" height="145.0" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
<text x="1490" y="172.98" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="14" >5A  Model-input preparation</text>
<text x="1490" y="190.98" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="14" >Scrub selected identifying metadata</text>
<text x="1490" y="208.98" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="14" >18 reviewed bipolar channels</text>
<text x="1490" y="226.98" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="14" >Resample 256 Hz; model filters</text>
<rect x="1370.0" y="325.0" width="200.0" height="140.0" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
<text x="1470" y="371.66" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="13" >5B  Window tensor</text>
<text x="1470" y="388.66" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="13" >4 seconds · 1,024 samples</text>
<text x="1470" y="405.66" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="13" >2-second stride</text>
<text x="1470" y="422.66" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="13" >float32 (N, 1024, 18)</text>
<rect x="1590.0" y="325.0" width="185.0" height="140.0" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2" filter="url(#shadow)"/>
<text x="1682.5" y="380.16" text-anchor="middle" fill="#4C1D95" font-family="Arial, sans-serif" font-size="13" >6  Reviewed H5 adapter</text>
<text x="1682.5" y="397.16" text-anchor="middle" fill="#4C1D95" font-family="Arial, sans-serif" font-size="13" >Artifact + contract hash checks</text>
<text x="1682.5" y="414.16" text-anchor="middle" fill="#4C1D95" font-family="Arial, sans-serif" font-size="13" >Fail closed on mismatch</text>
<rect x="1590.0" y="525.0" width="185.0" height="140.0" rx="12" fill="#FFF7ED" stroke="#FB923C" stroke-width="2" filter="url(#shadow)"/>
<text x="1682.5" y="580.16" text-anchor="middle" fill="#7C2D12" font-family="Arial, sans-serif" font-size="13" >7  Window findings</text>
<text x="1682.5" y="597.16" text-anchor="middle" fill="#7C2D12" font-family="Arial, sans-serif" font-size="13" >Score + threshold + source time</text>
<text x="1682.5" y="614.16" text-anchor="middle" fill="#7C2D12" font-family="Arial, sans-serif" font-size="13" >Research output, not diagnosis</text>
<rect x="1350.0" y="555.0" width="215.0" height="110.0" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
<text x="1457.5" y="595.16" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="13" >Optional SHAP</text>
<text x="1457.5" y="612.16" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="13" >Disabled by default</text>
<text x="1457.5" y="629.16" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="13" >Requires reviewed background</text>
<rect x="850.0" y="585.0" width="250.0" height="145.0" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" filter="url(#shadow)"/>
<text x="975" y="632.98" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="14" >5C  Retained review waveform</text>
<text x="975" y="650.98" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="14" >Full source-derived channels</text>
<text x="975" y="668.98" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="14" >Acquisition gaps + timestamps</text>
<text x="975" y="686.98" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="14" >Encrypted outside PostgreSQL</text>
<rect x="1120.0" y="585.0" width="220.0" height="145.0" rx="12" fill="#ECFEFF" stroke="#0891B2" stroke-width="2" filter="url(#shadow)"/>
<text x="1230" y="634.16" text-anchor="middle" fill="#164E63" font-family="Arial, sans-serif" font-size="13" >Clinical EEG viewer</text>
<text x="1230" y="651.16" text-anchor="middle" fill="#164E63" font-family="Arial, sans-serif" font-size="13" >12-second page · longitudinal bipolar</text>
<text x="1230" y="668.16" text-anchor="middle" fill="#164E63" font-family="Arial, sans-serif" font-size="13" >100 µV/cm · 30 mm/s</text>
<text x="1230" y="685.16" text-anchor="middle" fill="#164E63" font-family="Arial, sans-serif" font-size="13" >Flags + annotations on source time</text>
<rect x="300.0" y="820.0" width="1260.0" height="50.0" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="930" y="847.16" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="13" >Display filtering/scaling is separate from model preprocessing. The viewer does not normalize the original signal to hide amplitude or missing-data problems.</text>
</svg>