<text x="49" y="47" text-anchor="start" fill="#10243A" font-family="Arial, sans-serif" font-size="25" font-weight="700">VIDEO-ONLY  |  VSViG preprocessing, inference, and Grad-CAM review</text>
<rect x="40.0" y="345.0" width="210.0" height="115.0" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2" filter="url(#shadow)"/>
<text x="145" y="395.8" text-anchor="middle" fill="#4C1D95" font-family="Arial, sans-serif" font-size="15" >1  Separate video upload</text>
<text x="145" y="414.8" text-anchor="middle" fill="#4C1D95" font-family="Arial, sans-serif" font-size="15" >Not a combined VEEG clip</text>
<rect x="300.0" y="345.0" width="225.0" height="115.0" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" filter="url(#shadow)"/>
<text x="412.5" y="386.98" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="14" >2  Encrypt + retain original</text>
<text x="412.5" y="404.98" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="14" >Private file storage</text>
<text x="412.5" y="422.98" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="14" >Until case deletion</text>
<rect x="575.0" y="345.0" width="235.0" height="115.0" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
<text x="692.5" y="386.98" text-anchor="middle" fill="#78350F" font-family="Arial, sans-serif" font-size="14" >3  Temporary inference workspace</text>
<text x="692.5" y="404.98" text-anchor="middle" fill="#78350F" font-family="Arial, sans-serif" font-size="14" >Decrypt for bounded processing</text>
<text x="692.5" y="422.98" text-anchor="middle" fill="#78350F" font-family="Arial, sans-serif" font-size="14" >Clean plaintext after use</text>
<rect x="860.0" y="345.0" width="215.0" height="115.0" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2" filter="url(#shadow)"/>
<text x="967.5" y="386.98" text-anchor="middle" fill="#4C1D95" font-family="Arial, sans-serif" font-size="14" >4  Normalize + sample</text>
<text x="967.5" y="404.98" text-anchor="middle" fill="#4C1D95" font-family="Arial, sans-serif" font-size="14" >6 frames/second</text>
<text x="967.5" y="422.98" text-anchor="middle" fill="#4C1D95" font-family="Arial, sans-serif" font-size="14" >Pinned input geometry</text>
<rect x="1125.0" y="345.0" width="220.0" height="115.0" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2" filter="url(#shadow)"/>
<text x="1235" y="386.98" text-anchor="middle" fill="#4C1D95" font-family="Arial, sans-serif" font-size="14" >5  Lightweight OpenPose</text>
<text x="1235" y="404.98" text-anchor="middle" fill="#4C1D95" font-family="Arial, sans-serif" font-size="14" >Detect multiple people</text>
<text x="1235" y="422.98" text-anchor="middle" fill="#4C1D95" font-family="Arial, sans-serif" font-size="14" >Track streams separately</text>
<rect x="1395.0" y="325.0" width="235.0" height="155.0" rx="12" fill="#FFF7ED" stroke="#FB923C" stroke-width="2" filter="url(#shadow)"/>
<text x="1512.5" y="377.98" text-anchor="middle" fill="#7C2D12" font-family="Arial, sans-serif" font-size="14" >6  Per-track input gate</text>
<text x="1512.5" y="395.98" text-anchor="middle" fill="#7C2D12" font-family="Arial, sans-serif" font-size="14" >15 selected joints present</text>
<text x="1512.5" y="413.98" text-anchor="middle" fill="#7C2D12" font-family="Arial, sans-serif" font-size="14" >Missing joints → no score</text>
<text x="1512.5" y="431.98" text-anchor="middle" fill="#7C2D12" font-family="Arial, sans-serif" font-size="14" >No fabricated landmarks</text>
<rect x="1395.0" y="545.0" width="235.0" height="145.0" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2" filter="url(#shadow)"/>
<text x="1512.5" y="594.16" text-anchor="middle" fill="#4C1D95" font-family="Arial, sans-serif" font-size="13" >7  Build model tensors</text>
<text x="1512.5" y="611.16" text-anchor="middle" fill="#4C1D95" font-family="Arial, sans-serif" font-size="13" >15 RGB patches / frame</text>
<text x="1512.5" y="628.16" text-anchor="middle" fill="#4C1D95" font-family="Arial, sans-serif" font-size="13" >32×32 patches from 128×128 crops</text>
<text x="1512.5" y="645.16" text-anchor="middle" fill="#4C1D95" font-family="Arial, sans-serif" font-size="13" >30 samples / 5-second window</text>
<rect x="1125.0" y="570.0" width="220.0" height="125.0" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
<text x="1235" y="616.98" text-anchor="middle" fill="#4C1D95" font-family="Arial, sans-serif" font-size="14" >8  Pinned VSViG model</text>
<text x="1235" y="634.98" text-anchor="middle" fill="#4C1D95" font-family="Arial, sans-serif" font-size="14" >Window stride: 3 samples</text>
<text x="1235" y="652.98" text-anchor="middle" fill="#4C1D95" font-family="Arial, sans-serif" font-size="14" >Each detected track scored separately</text>
<rect x="860.0" y="570.0" width="215.0" height="125.0" rx="12" fill="#FFF7ED" stroke="#FB923C" stroke-width="2" filter="url(#shadow)"/>
<text x="967.5" y="616.98" text-anchor="middle" fill="#7C2D12" font-family="Arial, sans-serif" font-size="14" >9  Research result</text>
<text x="967.5" y="634.98" text-anchor="middle" fill="#7C2D12" font-family="Arial, sans-serif" font-size="14" >One uncalibrated score / window</text>
<text x="967.5" y="652.98" text-anchor="middle" fill="#7C2D12" font-family="Arial, sans-serif" font-size="14" >Configured threshold: 0.5</text>
<rect x="575.0" y="570.0" width="235.0" height="125.0" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
<text x="692.5" y="616.98" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="14" >10  Graph Grad-CAM</text>
<text x="692.5" y="634.98" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="14" >Relative contribution across</text>
<text x="692.5" y="652.98" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="14" >30 time samples × 15 patch nodes</text>
<rect x="300.0" y="570.0" width="225.0" height="125.0" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" filter="url(#shadow)"/>
<text x="412.5" y="617.66" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="13" >11  Protect result</text>
<text x="412.5" y="634.66" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="13" >Encrypt result payload in database</text>
<text x="412.5" y="651.66" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="13" >Source video stays encrypted on disk</text>
<rect x="40.0" y="570.0" width="210.0" height="125.0" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
<text x="145" y="617.66" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="13" >12  Owner review UI</text>
<text x="145" y="634.66" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="13" >Score timeline + flagged windows</text>
<text x="145" y="651.66" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="13" >Pose overlay + Grad-CAM patches</text>
<rect x="310.0" y="800.0" width="1280.0" height="52.0" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="950" y="828.16" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="13" >Track IDs do not identify the patient. Grad-CAM shows model-relative graph evidence; it is not pixel localization, seizure diagnosis, or brain-side inference.</text>
</svg>